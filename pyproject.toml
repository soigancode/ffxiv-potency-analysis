[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ffxiv-potency"
version = "0.1.0"
description = "Import FFXIV job-guide potency data and analyze FF Logs reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
ffxiv-potency = "ffxiv_potency.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.force-include]
"data/encounters" = "ffxiv_potency/data/encounters"
"data/consumables" = "ffxiv_potency/data/consumables"
"data/bard" = "ffxiv_potency/data/bard"
"data/machinist" = "ffxiv_potency/data/machinist"
"data/raid_effects" = "ffxiv_potency/data/raid_effects"
