[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ffxiv-potency"
version = "0.1.0"
description = "Import FFXIV job-guide potency data and analyze FF Logs reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
ffxiv-potency = "ffxiv_potency.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.force-include]
"data/encounters/101/penalties.json" = "ffxiv_potency/data/encounters/101/penalties.json"
"data/encounters/102/penalties.json" = "ffxiv_potency/data/encounters/102/penalties.json"
"data/encounters/104/penalties.json" = "ffxiv_potency/data/encounters/104/penalties.json"
"data/encounters/105/penalties.json" = "ffxiv_potency/data/encounters/105/penalties.json"
"data/encounters/1085/penalties.json" = "ffxiv_potency/data/encounters/1085/penalties.json"
"data/consumables/food/7.4/caramel_popcorn_hq.json" = "ffxiv_potency/data/consumables/food/7.4/caramel_popcorn_hq.json"
"data/consumables/potions/7.4/grade_4_gemdraught_of_dexterity_hq.json" = "ffxiv_potency/data/consumables/potions/7.4/grade_4_gemdraught_of_dexterity_hq.json"
"data/bard/7.55/actions.json" = "ffxiv_potency/data/bard/7.55/actions.json"
"data/bard/7.55/combat_profile.json" = "ffxiv_potency/data/bard/7.55/combat_profile.json"
"data/bard/gear_sets/7.4_savage.json" = "ffxiv_potency/data/bard/gear_sets/7.4_savage.json"
"data/bard/gear_sets/7.55_relic.json" = "ffxiv_potency/data/bard/gear_sets/7.55_relic.json"
"data/bard/weapon_delays.json" = "ffxiv_potency/data/bard/weapon_delays.json"
"data/machinist/7.55/actions.json" = "ffxiv_potency/data/machinist/7.55/actions.json"
"data/machinist/7.55/combat_profile.json" = "ffxiv_potency/data/machinist/7.55/combat_profile.json"
"data/machinist/7.55/pet_scaling.json" = "ffxiv_potency/data/machinist/7.55/pet_scaling.json"
"data/machinist/gear_sets/7.4_savage.json" = "ffxiv_potency/data/machinist/gear_sets/7.4_savage.json"
"data/machinist/gear_sets/7.55_relic.json" = "ffxiv_potency/data/machinist/gear_sets/7.55_relic.json"
"data/machinist/weapon_delays.json" = "ffxiv_potency/data/machinist/weapon_delays.json"
"data/raid_effects/7.55.json" = "ffxiv_potency/data/raid_effects/7.55.json"
